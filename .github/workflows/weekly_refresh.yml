name: Weekly refresh

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: betting_model/requirements.txt

      - run: pip install -r betting_model/requirements.txt

      - name: Check a fitted model is committed
        run: |
          test -f betting_model/models/epl/latest.json || {
            echo "::error::betting_model/models/epl/latest.json is missing. Run 'python scripts/fit_and_predict.py --league epl' locally and commit the result - CI predicts from the saved fit, it does not refit."
            exit 1
          }

      - name: Run weekly refresh
        working-directory: betting_model
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/weekly_refresh.py --league epl
