name: Score results

on:
  schedule:
    - cron: '0 7 * * *'   # daily, 07:00 UTC - after most match days have finished
  workflow_dispatch: {}

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r betting_model/requirements.txt

      - name: Score finished fixtures
        working-directory: betting_model
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/score_results.py --league epl --season 2025
